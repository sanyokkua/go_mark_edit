sonar.go.coverage.reportPaths=.local_tmp_files/sonar/coverage/go.out
sonar.javascript.lcov.reportPaths=.local_tmp_files/sonar/coverage/frontend/lcov.info
sonar.working.directory=.local_tmp_files/sonar/scannerwork
