sonar.projectKey=local:go-mark-edit
sonar.projectName=GoMarkEdit
sonar.sourceEncoding=UTF-8
sonar.sources=main.go,go.mod,internal,pkg,tools,frontend,scripts,build
sonar.tests=.
sonar.test.inclusions=tests/**/*.go,frontend/tests/**/*.ts,frontend/tests/**/*.tsx,**/*_test.go,tools/**/*.test.mjs
