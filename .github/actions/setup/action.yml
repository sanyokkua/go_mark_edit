name: Set up the Linux toolchain
description: Installs the Wails build dependencies, Go, Node, the pinned Go tools and the npm packages with caches.
inputs:
    browser:
        description: Also install the Playwright Chromium browser
        required: false
        default: 'false'
runs:
    using: composite
    steps:
        - name: Install Linux Wails toolchain
          shell: bash
          run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev lsof xvfb xclip
        - uses: actions/setup-go@v7
          with:
              go-version-file: go.mod
              cache: true
        - uses: actions/setup-node@v7
          with:
              node-version-file: .nvmrc
              cache: npm
              cache-dependency-path: frontend/package-lock.json
        - name: Read tool versions
          id: tools
          shell: bash
          run: |
              source scripts/lib/common.sh
              wails=$(sed -nE 's/^[[:space:]]*github\.com\/wailsapp\/wails\/v2[[:space:]]+([^[:space:]]+).*/\1/p' go.mod | head -1)
              playwright=$(node -p "require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version")
              echo "go-tools=$wails-$GOLANGCI_LINT_VERSION-$SHFMT_VERSION" >> "$GITHUB_OUTPUT"
              echo "playwright=$playwright" >> "$GITHUB_OUTPUT"
        - name: Cache Go tools
          uses: actions/cache@v4
          with:
              path: ~/go/bin
              key: go-tools-${{ runner.os }}-${{ steps.tools.outputs.go-tools }}
        - name: Cache Playwright browsers
          if: inputs.browser == 'true'
          uses: actions/cache@v4
          with:
              path: ~/.cache/ms-playwright
              key: playwright-${{ runner.os }}-${{ steps.tools.outputs.playwright }}
        - name: Install dependencies
          shell: bash
          run: scripts/build setup ${{ inputs.browser == 'true' && '--with-browser' || '' }}
