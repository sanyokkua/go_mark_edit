# The gate set, run by a machine rather than by memory.
#
# Two jobs, deliberately separate. `test` is the mechanical gate — the nine steps
# `just check` runs, in the same order. `interface` is the one `just check` cannot
# reach: Playwright, and with it the 14-key pixel contract, the 36-key behaviour
# contract, SC-FT-012's `repeatEach: 3` repetition proof, the attributed-residual
# and shrink rules, T120's additional-state gate and T054's accounting teardown.
# Until 2026-08-16 none of those ever ran here, and this workflow only ran at all
# on a `v*.*.*` tag, so nothing gated day-to-day work.
#
# CI is a strict superset of `just check`: everything `check` runs, plus the
# interface job. `justfile`'s comment on `check` says so.
name: gates

on:
  push:
    branches:
      - master
      - "feature/**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: staged quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Generate bindings
        run: just gen-check
      - name: Build frontend assets
        run: just frontend-build
      - name: Format check
        run: just fmt-check
      - name: Lint
        run: just lint
      - name: Frontend typecheck
        run: just typecheck
      - name: Frontend tests
        run: just frontend-test
      - name: Go vet
        run: just go-vet
      # Never diffed against a baseline and never suppressed: handler shape,
      # import direction, CGO-free build, migration immutability, and the
      # frontend's adapter/token boundaries. `just check` has always run it;
      # this workflow omitted it until 2026-08-16.
      - name: Architecture
        run: just archtest
      - name: Go race tests
        run: just go-test

  interface:
    name: interface gate
    runs-on: ubuntu-24.04
    # The suite takes ~5.2 minutes locally and is dominated by one case:
    # FR-FT-048 watches a live application for five continuous minutes. The
    # allowance is generous because a hosted runner is slower than a laptop, not
    # because the suite is expected to grow into it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      # Chromium only: `playwright.config.ts` defines two projects and both use
      # `browserName: 'chromium'`. Installing the other engines would download
      # ~400 MB that nothing runs.
      - name: Install Playwright Chromium and its host dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # `just e2e-test` is `playwright test` with no filter, and that is
      # load-bearing rather than incidental. The teardown's two guards treat a
      # dimension that recorded nothing as fatal whenever `CI` is set — which
      # Actions sets for us — so narrowing this to `--project=` or `-g` turns
      # the gate red rather than letting it pass having measured nothing.
      - name: Parity, behaviour and state contracts
        run: just e2e-test
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 14
          if-no-files-found: ignore

  release-skeleton:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, interface]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Release packaging is introduced in Phase 08 (see docs/delivery/plan/phase-08-install-it.md)."
