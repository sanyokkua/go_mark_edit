name: release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version (X.Y.Z, X.Y.Z-alpha.N, or X.Y.Z-beta.N)'
                required: true
                type: string

permissions:
    contents: read
    actions: read

# One release run per tag or branch at a time. A queued run waits for an in-progress publish rather
# than cancelling it, so a publish is never interrupted midway.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        outputs:
            sha: ${{ steps.version.outputs.sha }}
            version: ${{ steps.version.outputs.version }}
            prerelease: ${{ steps.version.outputs.prerelease }}
            mode: ${{ steps.gate.outputs.mode }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Validate version and source revision
              id: version
              shell: bash
              env:
                  REF_NAME: ${{ github.ref_name }}
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  source scripts/lib/release_version.sh
                  if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
                    version="$INPUT_VERSION"
                    sha="$(git rev-parse HEAD^{commit})"
                    [[ "$sha" == "$GITHUB_SHA" ]] || { echo 'checked-out branch differs from dispatched commit' >&2; exit 1; }
                  else
                    [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'release requires a version tag' >&2; exit 1; }
                    version="${REF_NAME#v}"
                    sha="$(git rev-parse "refs/tags/$REF_NAME^{commit}")"
                    local_tag="$(git rev-parse "refs/tags/$REF_NAME")"
                    remote_tag="$(git ls-remote origin "refs/tags/$REF_NAME" | cut -f1)"
                    [[ -n "$remote_tag" && "$local_tag" == "$remote_tag" ]] || { echo 'tag moved or disappeared' >&2; exit 1; }
                    [[ "$sha" == "$GITHUB_SHA" ]] || { echo 'tag commit differs from event commit' >&2; exit 1; }
                    git merge-base --is-ancestor "$sha" origin/master || { echo 'tag commit is not on master' >&2; exit 1; }
                  fi
                  [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid commit SHA' >&2; exit 1; }
                  parse_release_version "$version"
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
                  echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$RELEASE_VERSION_PRERELEASE" >> "$GITHUB_OUTPUT"
            - name: Find qualifying master verification
              id: gate
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TARGET_SHA: ${{ steps.version.outputs.sha }}
              run: |
                  set -euo pipefail
                  gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/push.yml/runs?branch=master&event=push&head_sha=$TARGET_SHA&per_page=100" > "$RUNNER_TEMP/push-runs.json"
                  node tools/verify/release-gate.mjs choose "$TARGET_SHA" "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/push-runs.json" > "$RUNNER_TEMP/verification-decision.json"
                  mode="$(jq -r .mode "$RUNNER_TEMP/verification-decision.json")"
                  if [[ "$mode" == inspect ]]; then
                    run_id="$(jq -r .id "$RUNNER_TEMP/verification-decision.json")"
                    gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/verification-run.json"
                    node tools/verify/release-gate.mjs inspect "$TARGET_SHA" "$GITHUB_REPOSITORY" "$run_id" < "$RUNNER_TEMP/verification-run.json" > "$RUNNER_TEMP/verification-decision.json"
                    mode="$(jq -r .mode "$RUNNER_TEMP/verification-decision.json")"
                  fi
                  case "$mode" in
                    reuse)
                      run_id="$(jq -r .id "$RUNNER_TEMP/verification-decision.json")"
                      attempt="$(jq -r .attempt "$RUNNER_TEMP/verification-decision.json")"
                      gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" > "$RUNNER_TEMP/verification-jobs.json"
                      node tools/verify/release-gate.mjs required "$TARGET_SHA" < "$RUNNER_TEMP/verification-jobs.json" || { echo 'required verification job did not succeed' >&2; exit 1; }
                      ;;
                    fallback) echo "No completed qualifying master verification; running the shared checks for $TARGET_SHA." ;;
                    *) echo "Latest qualifying verification failed or run inventory is incomplete for $TARGET_SHA." >&2; exit 1 ;;
                  esac
                  echo "mode=$mode" >> "$GITHUB_OUTPUT"
    fallback:
        needs: prepare
        if: ${{ needs.prepare.outputs.mode == 'fallback' }}
        uses: ./.github/workflows/verification.yml
        with:
            sha: ${{ needs.prepare.outputs.sha }}
        permissions:
            contents: read
    authorize:
        needs: [prepare, fallback]
        if: ${{ always() && !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            sha: ${{ needs.prepare.outputs.sha }}
            version: ${{ needs.prepare.outputs.version }}
            prerelease: ${{ needs.prepare.outputs.prerelease }}
        steps:
            - name: Authorize exact revision
              env:
                  PREPARE_RESULT: ${{ needs.prepare.result }}
                  FALLBACK_RESULT: ${{ needs.fallback.result }}
                  MODE: ${{ needs.prepare.outputs.mode }}
              run: |
                  if [[ "$PREPARE_RESULT" != success ]]; then
                    echo 'release preparation failed' >&2
                    exit 1
                  fi
                  case "$MODE:$FALLBACK_RESULT" in
                    reuse:skipped|fallback:success) ;;
                    *) echo "verification did not authorize release: $MODE / $FALLBACK_RESULT" >&2; exit 1 ;;
                  esac
    build:
        name: build (${{ matrix.target }})
        needs: authorize
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { target: macos-arm64, os: macos-15, platform: darwin/arm64 }
                    - { target: windows-amd64, os: windows-2025, platform: windows/amd64 }
                    - { target: windows-arm64, os: windows-11-arm, platform: windows/arm64 }
                    - { target: linux-amd64, os: ubuntu-24.04, platform: linux/amd64 }
                    - { target: linux-arm64, os: ubuntu-24.04-arm, platform: linux/arm64 }
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.authorize.outputs.sha }}
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install Linux build libraries
              if: runner.os == 'Linux'
              shell: bash
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
            - name: Install release build dependencies
              shell: bash
              run: scripts/build setup --release
            - name: Set numeric Windows resource version
              if: runner.os == 'Windows'
              shell: bash
              env:
                  RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
              run: |
                  node --input-type=commonjs <<'NODE'
                  const fs = require('node:fs');
                  const path = 'wails.json';
                  const config = JSON.parse(fs.readFileSync(path, 'utf8'));
                  config.info.productVersion = process.env.RELEASE_VERSION.split('-')[0];
                  fs.writeFileSync(path, `${JSON.stringify(config, null, 4)}\n`);
                  NODE
            - name: Build executable
              shell: bash
              env:
                  RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
                  RELEASE_PLATFORM: ${{ matrix.platform }}
              run: scripts/build --release --platform "$RELEASE_PLATFORM" --version "$RELEASE_VERSION"
            - name: Package release asset
              id: package
              shell: bash
              env:
                  RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
                  RELEASE_TARGET: ${{ matrix.target }}
              run: |
                  set -euo pipefail
                  asset="GoMarkEdit-$RELEASE_VERSION-$RELEASE_TARGET"
                  case "$RUNNER_OS" in
                    macOS)
                      asset="$asset.zip"
                      ditto -c -k --keepParent build/bin/GoMarkEdit.app "$asset"
                      ;;
                    Windows)
                      asset="$asset.exe"
                      cp build/bin/GoMarkEdit.exe "$asset"
                      ;;
                    Linux)
                      cp build/bin/GoMarkEdit "$asset"
                      chmod 755 "$asset"
                      ;;
                    *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
                  esac
                  echo "path=$asset" >> "$GITHUB_OUTPUT"
            - name: Upload release asset
              uses: actions/upload-artifact@v7
              with:
                  name: release-asset-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
                  path: ${{ steps.package.outputs.path }}
                  if-no-files-found: error
    collect:
        needs: [authorize, build]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.authorize.outputs.sha }}
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
            - name: Download this attempt's release assets
              uses: actions/download-artifact@v8
              with:
                  pattern: release-asset-${{ github.run_id }}-${{ github.run_attempt }}-*
                  path: release-assets
            - name: Require all five assets and write checksums
              env:
                  RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
              run: node tools/verify/release-assets.mjs release-assets "$RELEASE_VERSION"
            - name: Upload manual dry-run package
              if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v7
              with:
                  name: GoMarkEdit-${{ needs.authorize.outputs.version }}-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
                  path: release-assets/
                  if-no-files-found: error
    publish:
        if: github.event_name == 'push'
        needs: [authorize, collect]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.authorize.outputs.sha }}
                  fetch-depth: 0
            - name: Download this attempt's release assets
              uses: actions/download-artifact@v8
              with:
                  pattern: release-asset-${{ github.run_id }}-${{ github.run_attempt }}-*
                  path: release-assets
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
            - name: Recheck the complete asset inventory
              env:
                  RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
              run: node tools/verify/release-assets.mjs release-assets "$RELEASE_VERSION"
            - name: Publish one complete release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
                  RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
                  RELEASE_PRERELEASE: ${{ needs.authorize.outputs.prerelease }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  check_remote_tag() {
                    local current
                    current="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)"
                    if [[ -z "$current" ]]; then
                      current="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)"
                    fi
                    [[ "$current" == "$RELEASE_SHA" ]] || { echo 'release tag moved or disappeared' >&2; exit 1; }
                  }
                  check_remote_tag
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "release already exists: $RELEASE_TAG" >&2
                    exit 1
                  fi
                  args=("$RELEASE_TAG" --verify-tag --draft --title "GoMarkEdit $RELEASE_VERSION" --notes-from-tag)
                  if [[ "$RELEASE_PRERELEASE" == true ]]; then args+=(--prerelease); fi
                  # A draft blocks later attempts for this tag, so any failure after creation removes it
                  # (the tag is kept); the release becomes visible only in the final edit.
                  remove_unpublished_draft() {
                    local status=$?
                    trap - EXIT
                    # Never delete a release that was already published.
                    if [[ "$status" -ne 0 && "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" == true ]]; then
                      gh release delete "$RELEASE_TAG" --yes || echo "could not remove draft release $RELEASE_TAG" >&2
                    fi
                    exit "$status"
                  }
                  gh release create "${args[@]}"
                  trap remove_unpublished_draft EXIT
                  trap 'exit 143' TERM
                  trap 'exit 130' INT
                  mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
                  [[ "${#assets[@]}" -eq 6 ]] || { echo 'release asset count changed after validation' >&2; exit 1; }
                  gh release upload "$RELEASE_TAG" "${assets[@]}"
                  expected_names=()
                  for asset in "${assets[@]}"; do expected_names+=("${asset##*/}"); done
                  expected_inventory="$(printf '%s\n' "${expected_names[@]}" | sort)"
                  remote_inventory="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
                  [[ "$remote_inventory" == "$expected_inventory" ]] || { echo 'draft release asset inventory differs from the validated package' >&2; exit 1; }
                  check_remote_tag
                  gh release edit "$RELEASE_TAG" --draft=false
