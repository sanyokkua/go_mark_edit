name: push

on:
    push:
        branches:
            - '**'

jobs:
    cross-platform-go:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true
            - name: Validate release version formats
              shell: bash
              run: |
                  source scripts/lib/release_version.sh
                  for version in 1.2.3; do
                    parse_release_version "$version" || { echo "expected valid version: $version" >&2; exit 1; }
                    if [[ "$RELEASE_VERSION_PRERELEASE" != false ]]; then
                      echo "stable release was classified as a prerelease: $version" >&2
                      exit 1
                    fi
                  done
                  for version in 1.2.3-alpha.1 1.2.3-beta.12; do
                    parse_release_version "$version" || { echo "expected valid version: $version" >&2; exit 1; }
                    if [[ "$RELEASE_VERSION_PRERELEASE" != true ]]; then
                      echo "expected prerelease classification: $version" >&2
                      exit 1
                    fi
                  done
                  for version in 1.2 1.2.3-rc.1 1.2.3-alpha 1.2.3-alpha.01 1.2.3-beta.0; do
                    if parse_release_version "$version"; then
                      echo "expected invalid version: $version" >&2
                      exit 1
                    fi
                  done
            - name: Test file save and workspace behavior
              run: >-
                  go test ./tests/go/unit/apperr ./tests/go/unit/file ./tests/go/unit/workspace
                  ./tests/go/integration/appmodel ./tests/go/integration/application
            - name: Build Go packages
              run: go build ./...
    verify:
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v7
            - name: Install Linux Wails toolchain
              run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev lsof
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: scripts/build setup
            - name: Verify
              run: scripts/verify --skip e2e
            - name: Upload verification artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: verification-runs-${{ github.run_id }}
                  path: |
                      .local_tmp_files/runs/**/summary.json
                      .local_tmp_files/runs/**/lint.json
                      .local_tmp_files/runs/**/format.json
                      .local_tmp_files/runs/**/build.json
                      .local_tmp_files/runs/**/unit.json
                      .local_tmp_files/runs/**/integration.json
                      .local_tmp_files/runs/**/e2e.json
                      .local_tmp_files/runs/**/reports/**
                      .local_tmp_files/runs/**/*.log
                      .local_tmp_files/runs/**/*.stderr
                      .local_tmp_files/runs/**/frontend-*.json
                      .local_tmp_files/runs/**/frontend-e2e-results/**
                  include-hidden-files: true
                  if-no-files-found: ignore
