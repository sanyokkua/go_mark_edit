name: push

on:
    pull_request:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verification-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        uses: ./.github/workflows/verification.yml
        with:
            sha: ${{ github.sha }}
